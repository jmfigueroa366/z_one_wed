<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-ONE | Iniciar sesión</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card" aria-labelledby="loginTitle">
            <a class="login-brand" href="index.html" aria-label="Volver a Z-ONE">
                <span class="brand-mark">Z-</span><span>ONE</span>
            </a>

            <div class="login-header">
                <p class="eyebrow">ACCESO A Z-ONE</p>
                <h1 id="loginTitle">Iniciar sesión</h1>
                <p>Entra a tu espacio de producción musical.</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-field">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" autocomplete="username" placeholder="Escribe tu usuario" required>
                </div>

                <div class="form-field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Escribe tu contraseña" required>
                </div>

                <button id="btnLogin" class="login-button" type="submit">Entrar al panel</button>
                <p id="mensaje" class="mensaje" role="alert" aria-live="polite"></p>
            </form>

            <p class="register-link">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
        </section>
    </main>

    <script src="../js/login.js"></script>
</body>
</html>
