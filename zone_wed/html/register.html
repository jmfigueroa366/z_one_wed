<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-ONE | Registrar usuario</title>
    <link rel="stylesheet" href="../css/register.css">
</head>
<body class="register-page">
    <div class="register-shell">
        <div class="register-card">
            <div class="register-brand">
                <div class="brand-mark">◉</div>
                <span>Z-ONE</span>
            </div>

            <div class="register-header">
                <p class="eyebrow">REGISTRO</p>
                <h1>Crear cuenta</h1>
                <p class="subtitle">Únete a la plataforma musical de producción y gestión</p>
            </div>

            <form class="register-form" id="registerForm">
                <div class="field-row">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Tu nombre completo" required>
                </div>

                <div class="field-row">
                    <label for="email">Correo</label>
                    <input type="email" id="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="field-row">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Crea una contraseña" required>
                </div>

                <button type="submit" class="btn-primary wide">Crear cuenta</button>
                <p id="registerMessage" class="register-message" role="alert" aria-live="polite"></p>
            </form>

            <p class="login-link">
                Ya tienes cuenta?
                <a href="login.html">Inicia sesión</a>
            </p>
        </div>
    </div>

    <script src="../js/register.js"></script>
</body>
</html>
